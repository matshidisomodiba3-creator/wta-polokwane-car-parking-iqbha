name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Download your files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download wta-input --clobber
          # Big projects arrive in pieces: glue them back into one zip (names sort in order).
          if ls source.zip.part* >/dev/null 2>&1; then cat source.zip.part* > source.zip && rm -f source.zip.part*; fi
          if [ -f icon.png ]; then mkdir -p assets-wta && mv icon.png assets-wta/icon.png; fi
          ls -la
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        shell: bash
        run: |
          # The runner already ships the Android SDK. Use it directly (the setup-android action's
          # sdkmanager step fails intermittently with exit code 1) and tolerate harmless sdkmanager errors.
          set +e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKM" ]; then SDKM=$(command -v sdkmanager); fi
          echo "sdkmanager: $SDKM"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-license"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1
            for i in 1 2 3; do
              "$SDKM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" && break
              echo "sdkmanager attempt $i failed — retrying"; sleep 5
            done
          fi
          ls "$SDK/platforms" "$SDK/build-tools" 2>/dev/null
          exit 0
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Build your web app
        run: node scripts/prepare-web.mjs
        env:
          # Protected keys: read from GitHub Secrets only during this step (masked in logs, never committed)
          WTA_SECRETS: ${{ secrets.WTA_SECRETS }}
      - name: Create Android project
        run: npx cap add android && npx cap sync android
      - name: Apply icon, permissions & features
        run: node scripts/configure-android.mjs
      - name: Compile APK with Gradle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ ! -f signing/release.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/release.keystore -alias wta -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass webtoapp -keypass webtoapp -dname "CN=$(node -p "require('./wta.json').appName"), O=Web to App Instant"
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          mkdir -p out
          NAME=$(node -p "require('./wta.json').fileName")
          "$BT/apksigner" sign --ks signing/release.keystore --ks-key-alias wta --ks-pass pass:webtoapp --key-pass pass:webtoapp --out "out/$NAME.apk" aligned.apk
          cp signing/release.keystore out/signing.keystore
          ls -la out
      - name: Publish APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "app-$GITHUB_RUN_NUMBER" out/* --title "$(node -p "require('./wta.json').appName") build $GITHUB_RUN_NUMBER" --notes "Built by Web to App Instant" --prerelease
